<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Televerde · Programas de TV</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>

  <header id="header" class="header"></header>

  <!-- Programa destacado -->
  <section id="hero" class="hero">
    <div class="hero-contenido">
      <p class="hero-presenta" id="heroProductora">Cargando...</p>
      <p class="hero-categoria" id="heroCategoria"></p>
      <h1 class="hero-titulo titulo-grande" id="heroTitulo"></h1>
      <div class="hero-meta" id="heroMeta"></div>
      <p class="hero-sinopsis" id="heroSinopsis"></p>
      <div class="hero-botones">
        <button class="btn-play" id="heroPlay" title="Ver trailer">▶</button>
        <a class="btn btn-verde" id="heroVer" href="#">Ver detalles</a>
      </div>
    </div>
    <div class="hero-miniaturas" id="heroMiniaturas"></div>
  </section>

  <!-- Ultimos estrenos -->
  <section class="seccion">
    <div>
      <h2 class="seccion-titulo titulo-grande" id="tituloFila">Últimos<br>estrenos</h2>
      <p class="seccion-ayuda">Desliza →</p>
    </div>
    <div class="fila" id="filaEstrenos"></div>
  </section>

  <!-- Top tendencia -->
  <section class="seccion">
    <div>
      <h2 class="seccion-titulo titulo-grande">Top<br>tendencia</h2>
      <p class="seccion-ayuda">Desliza →</p>
    </div>
    <div class="fila" id="filaTop"></div>
  </section>

  <!-- Categorias -->
  <section class="seccion">
    <div>
      <h2 class="seccion-titulo titulo-grande">Elige<br>categoría</h2>
      <p class="seccion-ayuda">Toca para filtrar</p>
    </div>
    <div class="fila" id="filaCategorias"></div>
  </section>

  <footer class="footer">
    <div class="logo">tele<span>verde.</span></div>
    <p>Proyecto Express 2026 · Daniel Borja</p>
  </footer>

  <!-- Modal del trailer -->
  <div class="modal" id="modal">
    <div class="modal-caja">
      <button class="btn btn-borde btn-chico modal-cerrar" onclick="cerrarTrailer()">Cerrar ✕</button>
      <iframe id="video" class="video" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/index.js"></script>
</body>
</html>
